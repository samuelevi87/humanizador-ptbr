# Valida o pacote (frontmatter, manifests, versões e regra do travessão) a cada push e pull request.
name: validar

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validar_pacote.py
